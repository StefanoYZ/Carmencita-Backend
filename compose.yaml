services:
  postgres:
    image: postgres:16-alpine
    container_name: carmencita-postgres-dev
    environment:
      POSTGRES_DB: carmencita_db
      POSTGRES_USER: carmencita
      POSTGRES_PASSWORD: carmencita_dev
    ports:
      - "5432:5432"
    volumes:
      - carmencita-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmencita -d carmencita_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: carmencita-redis-dev
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  carmencita-postgres-data:
